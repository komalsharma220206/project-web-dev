<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
           height:300px;
           width:300px;
           border: 2px solid black;   
           margin:10px;
           border-radius:40px; 
           background-color: pink;
           padding:30px;
           box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>TO DO LIST</h2>
        <form action="post">
            <div>
                <input type="radio" id="GYM" value="yes">
                <label for="gym">GYM</label>
                
            </div>
            <div>
                <input type="radio" id="work" value="yes">
                <label for="work">WORK</label>
                
            </div>
            <div>
                <input type="radio" id="chant" value="yes">
                <label for="chant">CHANT</label>
                
            </div>
            <div>
                <input type="radio" id="mangla aarti" value="yes">
                <label for="mangla aarti">MANGLA AARTI</label>
                
            </div>
                
            <div>
                <input type="radio" id="skin" value="yes">
                <label for="skin">SKINCARE</label>
                
            </div>
            <div>
                 <input type="radio" id="brain" value="yes">
                <label for="brain">BRAIN EXERCISE</label>
               
            </div>
        </form>
    </div>
</body>
</html>
