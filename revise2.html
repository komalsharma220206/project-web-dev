<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box::after{
            content:"hey i am a superstar"
        }
        ::selection{
            background-color: dodgerblue;
        }
        .box1::first-letter{
            background-color: aqua;
           
        }
        input::placeholder{
            color: aqua;
        }
    </style>
</head>
<body>
   <div class="box">
       <div class="box1">hey i am a good girl and i am going for my home i am gonna call you tomorrow for meeting</div>
       <div class="box1">hey how are you doing</div>
       <div class="box1">let's play</div>
       <div class="box2"> you are not good</div>

   </div>
   <div>
    <form action="post">
        <label for="name">ENTER YOUR NAME</label>
        <input type="text" class="name" id="name" placeholder="name">
    </form>
   </div>
</body>
</html>
